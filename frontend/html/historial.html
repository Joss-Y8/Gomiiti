<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Gomitti</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>
<body>
    <header class="topbar">
        <strong>Gomitti</strong>
        <nav aria-label="Principal">
            <a href="../../index.html">Inicio</a>
            <a href="pedido.html">Pedidos</a>
            <a href="historial.html">Historial de pedidos</a>
            <a class="solo-admin" href="inventario.html">Inventario</a>
            <a class="solo.admin" href="catalogo.html">Catálogo</a>  
        </nav>
        <span>
            <span data-usuario></span>
            <span class="badge" data-rol-texto></span>
            <button class="sec" onclick="cerrarSesion()">Salir</button>
        </span>
    </header>
    <main>
        <h1>Registro de Ventas</h1>
        <section class="solo-admin card" aria-label="Filtros y acumulados">
            <label for="f-fecha">Fecha</label><input id="f-fecha" type="date">
            <label for="f-pago">Método de pago</label>
            <select id="f-pago">
                <option value="">Todos</option>
                <option value="">Efectivo</option>
                <option value="">Tarjeta</option>
            </select>
            <p>Total acumulado: <strong id="acumulado">-</strong></p>
        </section>
        <p class="solo-cajero">Mostrando solo las ventas de tu turno.</p>
        <div class="tabla-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Folio</th>
                        <th>Hora</th>
                        <th>Productos</th>
                        <th>Pago</th>
                        <th>Monto</th>
                        <th class="solo-admin">Extras y notas</th>
                    </tr>
                </thead>
                <tbody id="ventas" aria-live="polite">
                    <tr><td colspan="5">Cargando ventas...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="/backend/js/auth.js"></script>
    <script>protegerPagina();</script>
    <script src="/backend/js/historial.js"></script>
</body>
</html>
